name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later. Pinned instead of @latest: npm 12 ignores
      # npm-shrinkwrap.json in `npm ci`, which this fork ships instead of package-lock.json.
      - name: Update npm
        run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish --provenance
